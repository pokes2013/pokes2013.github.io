<body>
  <div id="app"></div>
  <script>
      window.$docsify = {
        plugins: [
          function(hook) {
            var footer = [
              '<hr/>',
              '<footer>',
              '<span><a href="https://github.com/spokes">pokes</a> &copy;2025.</span>',
              '<span>Proudly published with <a href="https://github.com/docsifyjs/docsify" target="_blank">docsify</a>.</span>',

            ].join('');
            hook.afterEach(function(html) {
              return html + footer;
            });
          }
        ],
        name: '<span>👨‍🍳外卖品尝师</span>',
        repo: '',
        loadSidebar: true,        // 开启手动侧边栏（_sidebar.md）

        loadNavbar: true,         // 加载导航栏（_navbar.md）
        coverpage: false,
        maxLevel: 5,
        pdfEmbed: {
          width: '80%'
        },
        mergeNavbar: true,
        // ========= 配置 docsify-plugin-toc 右侧大纲 =========
        toc: {
          tocMaxLevel: 4,        // 提取标题层级，h2~h4
          target: 'h2,h3,h4',    // 要抓取哪些标题
          ignoreHeaders: []
        }
      }
  </script>
